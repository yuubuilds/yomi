<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>Yomi</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="titlebar">
    <div id="tabs-container">
      <button id="btn-open" title="ファイルを開く">＋</button>
      <div id="tabs"></div>
    </div>
    <div id="titlebar-actions">
      <button id="btn-ws"     title="空白文字を表示">¶</button>
      <button id="btn-syntax" title="構文ハイライト切替" class="active">S</button>
      <button id="btn-font-down" title="文字サイズを小さく">A-</button>
      <button id="btn-font-up"   title="文字サイズを大きく">A+</button>
      <select id="font-select" title="フォント選択">
        <option value="'Cascadia Code', monospace">Cascadia Code</option>
        <option value="'JetBrains Mono', monospace">JetBrains Mono</option>
        <option value="'Fira Code', monospace">Fira Code</option>
        <option value="Consolas, monospace">Consolas</option>
        <option value="'Courier New', monospace">Courier New</option>
        <option value="'MS Gothic', monospace">MS ゴシック</option>
        <option value="'BIZ UDGothic', monospace">BIZ UDゴシック</option>
        <option value="'Meiryo UI', 'Meiryo', sans-serif">Meiryo UI</option>
        <option value="'Yu Gothic', 'YuGothic', sans-serif">游ゴシック</option>
      </select>
      <button id="btn-theme" title="テーマ切り替え">🌙</button>
    </div>
  </div>

  <div id="editor-wrap">
    <div id="welcome">
      <div class="welcome-title">Yomi</div>
      <div class="welcome-hint">ファイルをドロップ、または＋ボタンで開く</div>
    </div>
  </div>

  <div id="statusbar">
    <span id="status-file">—</span>
    <span class="status-right">
      <select id="enc-select" title="文字コード">
        <option value="UTF-8">UTF-8</option>
        <option value="Shift-JIS">Shift-JIS</option>
        <option value="EUC-JP">EUC-JP</option>
        <option value="UTF-16 LE">UTF-16 LE</option>
        <option value="UTF-16 BE">UTF-16 BE</option>
        <option value="GBK">GBK</option>
      </select>
      <span id="status-eol">LF</span>
      <span id="status-cursor">1:1</span>
    </span>
  </div>

  <script src="/js/neutralino.js"></script>
  <script src="/js/bundle.js"></script>
</body>
</html>
